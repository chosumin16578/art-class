<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>말을 걸어주는 미술관</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter 및 Pretendard(한글 가독성) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <script>
        // Tailwind 다크모드 및 미술관 커스텀 컬러 설정
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        serif: ['Noto Serif KR', 'serif'],
                    },
                    colors: {
                        gallery: {
                            lightBg: '#F8F7F4',
                            lightCard: '#FFFFFF',
                            darkBg: '#121212',
                            darkCard: '#1E1E1E',
                            accent: '#3B6E5C',
                            accentHover: '#2E5748',
                            gold: '#B89758'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 커스텀 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 부드러운 페이드인 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        /* 타이핑 인디케이터 점 애니메이션 */
        .typing-dot {
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gallery-lightBg text-stone-800 dark:bg-gallery-darkBg dark:text-stone-100 transition-colors duration-200 h-[100dvh] flex flex-col overflow-hidden select-none sm:select-auto">

    <!-- 상단 헤더 -->
    <header class="bg-gallery-lightCard/95 dark:bg-gallery-darkCard/95 backdrop-blur-md border-b border-stone-200/80 dark:border-stone-800 px-3.5 sm:px-5 py-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-9 h-9 rounded-xl bg-gallery-accent dark:bg-emerald-800 flex items-center justify-center text-white shadow-sm shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <div class="min-w-0">
                <h1 class="font-serif font-bold text-base sm:text-lg leading-tight tracking-tight text-stone-900 dark:text-white truncate">말을 걸어주는 미술관</h1>
                <p class="text-[11px] text-stone-500 dark:text-stone-400 font-medium truncate">작품 사진을 올리고 대화하며, 기술·분석·해석·판단 4단계로 현대미술을 감상해 보는 도우미예요.</p>
            </div>
        </div>

        <div class="flex items-center gap-1 sm:gap-1.5 shrink-0 ml-2">
            <!-- '정리해 줘' 버튼 -->
            <button id="summarizeBtn" onclick="triggerSummaryRequest()" class="flex items-center gap-1 bg-amber-50 hover:bg-amber-100 dark:bg-amber-950/60 dark:hover:bg-amber-900/70 text-amber-800 dark:text-amber-300 border border-amber-200/80 dark:border-amber-800/60 px-2.5 sm:px-3 py-2 rounded-xl text-xs font-semibold transition-all active:scale-95 shadow-xs">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                <span>정리해 줘</span>
            </button>

            <!-- 다크모드 토글 -->
            <button id="themeToggleBtn" onclick="toggleTheme()" aria-label="테마 변경" title="화면 테마 변경" class="p-2 rounded-xl text-stone-500 hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800 transition-colors">
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 block dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <!-- 대화 초기화 버튼 -->
            <button onclick="resetChat()" aria-label="대화 초기화" title="대화 초기화" class="flex items-center gap-1 p-2 rounded-xl text-stone-500 hover:bg-stone-100 dark:text-stone-400 dark:hover:bg-stone-800 transition-colors text-xs font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
                <span class="hidden md:inline">대화 초기화</span>
            </button>
        </div>
    </header>

    <!-- 메인 채팅 영역 -->
    <main id="chatContainer" class="flex-1 overflow-y-auto px-4 py-5 space-y-4 scroll-smooth">
        <!-- 초기 환영 메시지가 JS로 렌더링됩니다 -->
    </main>

    <!-- 하단 컨트롤 영역 -->
    <footer class="bg-gallery-lightCard dark:bg-gallery-darkCard border-t border-stone-200/80 dark:border-stone-800 pt-2.5 pb-3 px-3 sm:px-4 shrink-0 z-20">
        <div class="max-w-3xl mx-auto">
            <!-- 첨부 이미지 미리보기 -->
            <div id="imagePreviewContainer" class="hidden mb-2.5 px-1 animate-fade-in">
                <div class="relative inline-block">
                    <img id="imagePreviewThumb" src="" alt="첨부할 작품 미리보기" class="h-20 w-auto max-w-[160px] object-cover rounded-xl border border-stone-300 dark:border-stone-700 shadow-sm">
                    <button type="button" onclick="clearSelectedImage()" aria-label="첨부 이미지 삭제" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-stone-800 text-white hover:bg-red-600 flex items-center justify-center shadow-md transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <p class="text-[11px] text-gallery-accent dark:text-emerald-400 font-medium mt-1">사진이 준비되었어요. 전송 버튼을 누르거나 질문을 함께 적어 주세요.</p>
            </div>

            <!-- 빠른 안내 / 펠드먼 4단계 보조 칩 -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-2">
                <button type="button" onclick="triggerImageUpload()" class="shrink-0 bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/60 dark:hover:bg-emerald-900/70 text-gallery-accent dark:text-emerald-300 border border-emerald-200/80 dark:border-emerald-800/70 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all flex items-center gap-1.5 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    <span>작품 사진 올리기</span>
                </button>
                <span class="text-stone-300 dark:text-stone-700 text-xs">|</span>
                <button type="button" onclick="handleStepChipClick('1단계 기술 단계로 진행해 주세요.')" class="shrink-0 text-[11px] text-stone-600 hover:text-stone-900 hover:bg-stone-200/70 dark:text-stone-300 dark:hover:bg-stone-700 px-2.5 py-1.5 bg-stone-100 dark:bg-stone-800/80 rounded-xl font-medium transition-colors active:scale-95">1단계 기술</button>
                <button type="button" onclick="handleStepChipClick('2단계 분석 단계로 진행해 주세요.')" class="shrink-0 text-[11px] text-stone-600 hover:text-stone-900 hover:bg-stone-200/70 dark:text-stone-300 dark:hover:bg-stone-700 px-2.5 py-1.5 bg-stone-100 dark:bg-stone-800/80 rounded-xl font-medium transition-colors active:scale-95">2단계 분석</button>
                <button type="button" onclick="handleStepChipClick('3단계 해석 단계로 진행해 주세요.')" class="shrink-0 text-[11px] text-stone-600 hover:text-stone-900 hover:bg-stone-200/70 dark:text-stone-300 dark:hover:bg-stone-700 px-2.5 py-1.5 bg-stone-100 dark:bg-stone-800/80 rounded-xl font-medium transition-colors active:scale-95">3단계 해석</button>
                <button type="button" onclick="handleStepChipClick('4단계 판단 단계로 진행해 주세요.')" class="shrink-0 text-[11px] text-stone-600 hover:text-stone-900 hover:bg-stone-200/70 dark:text-stone-300 dark:hover:bg-stone-700 px-2.5 py-1.5 bg-stone-100 dark:bg-stone-800/80 rounded-xl font-medium transition-colors active:scale-95">4단계 판단</button>
            </div>

            <!-- 숨겨진 파일 입력 -->
            <input type="file" id="imageFileInput" accept="image/*" class="hidden" onchange="handleImageFileSelect(event)">

            <!-- 메시지 입력 폼 -->
            <form id="chatForm" onsubmit="handleFormSubmit(event)" class="flex items-end gap-2">
                <!-- 사진 첨부 버튼 -->
                <button 
                    type="button" 
                    onclick="triggerImageUpload()" 
                    aria-label="작품 사진 올리기"
                    title="작품 사진 올리기 (카메라/앨범)"
                    class="w-11 h-11 rounded-2xl bg-stone-100 hover:bg-stone-200/80 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-200 border border-stone-200 dark:border-stone-700 flex items-center justify-center shrink-0 transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </button>

                <!-- 텍스트 입력창 -->
                <div class="flex-1 bg-stone-100 dark:bg-stone-800/90 rounded-2xl border border-stone-200 dark:border-stone-700 focus-within:border-gallery-accent dark:focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-gallery-accent/15 transition-all px-3.5 py-2">
                    <textarea 
                        id="userInput" 
                        rows="1" 
                        placeholder="작품 사진을 올리거나 생각을 적어 주세요..." 
                        class="w-full bg-transparent text-sm text-stone-900 dark:text-stone-100 placeholder-stone-400 dark:placeholder-stone-500 focus:outline-none resize-none max-h-28 leading-relaxed"
                        oninput="autoResizeTextarea(this)"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                </div>

                <!-- 전송 버튼 -->
                <button 
                    type="submit" 
                    id="sendBtn"
                    aria-label="전송"
                    class="w-11 h-11 rounded-2xl bg-gallery-accent hover:bg-gallery-accentHover dark:bg-emerald-700 dark:hover:bg-emerald-600 disabled:opacity-40 disabled:pointer-events-none text-white flex items-center justify-center shrink-0 shadow-sm transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 translate-x-0.5 -translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </footer>

    <!-- 커스텀 토스트 알림창 -->
    <div id="toastNotification" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-stone-900/95 dark:bg-stone-100/95 text-white dark:text-stone-900 px-4 py-2.5 rounded-full text-xs font-semibold shadow-lg pointer-events-none opacity-0 transition-opacity duration-200 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400 dark:text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span id="toastMessage">복사되었어요!</span>
    </div>

    <script>
        // ==========================================
        // 2. 초기화 및 테마 관리
        // ==========================================
        window.onload = function() {
            initTheme();
            renderWelcomeMessage();
        };

        function initTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2400);
        }

        // ==========================================
        // 3. 이미지 업로드 및 리사이징 처리 (최대 1024px, JPEG 0.85)
        // ==========================================
        function triggerImageUpload() {
            if (isGenerating) return;
            document.getElementById('imageFileInput').click();
        }

        function handleImageFileSelect(event) {
            const file = event.target.files?.[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast("이미지 파일만 올릴 수 있어요.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 1024;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const base64Data = compressedDataUrl.split(',')[1];

                    pendingImage = {
                        base64: base64Data,
                        mimeType: 'image/jpeg',
                        dataUrl: compressedDataUrl
                    };

                    document.getElementById('imagePreviewThumb').src = compressedDataUrl;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('userInput').focus();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function clearSelectedImage() {
            pendingImage = null;
            document.getElementById('imagePreviewThumb').src = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        // ==========================================
        // 4. 채팅 UI 렌더링 및 대화 시작 문구
        // ==========================================
        function renderWelcomeMessage() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';

            const welcomeHTML = `
                <div class="flex items-start gap-2.5 max-w-[92%] sm:max-w-[82%] animate-fade-in">
                    <div class="w-8 h-8 rounded-full bg-gallery-accent dark:bg-emerald-800 text-white flex items-center justify-center shrink-0 mt-0.5 text-xs font-serif font-bold shadow-xs">
                        미술관
                    </div>
                    <div class="bg-gallery-lightCard dark:bg-gallery-darkCard border border-stone-200/80 dark:border-stone-800 rounded-2xl rounded-tl-sm px-4 py-3.5 shadow-xs space-y-3 text-sm leading-relaxed">
                        <p class="text-stone-800 dark:text-stone-200">
                            안녕하세요! 말을 걸어주는 미술관에 오신 것을 환영해요. 오늘 함께 감상할 작품 사진을 올려 주시겠어요? 아래 대화 시작 문구를 눌러 시작해도 좋답니다.
                        </p>
                        <!-- 대화 시작 문구 3개 버튼 -->
                        <div class="pt-0.5 flex flex-col sm:flex-row flex-wrap gap-2">
                            <button type="button" onclick="handleStarterClick('작품 사진을 올릴게요')" class="text-left text-xs font-medium bg-stone-100 hover:bg-emerald-50 active:bg-emerald-100 dark:bg-stone-800 dark:hover:bg-emerald-950/60 text-stone-800 dark:text-stone-200 border border-stone-200/80 dark:border-stone-700 px-3.5 py-2.5 rounded-xl transition-colors flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gallery-accent dark:text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                <span>작품 사진을 올릴게요</span>
                            </button>
                            <button type="button" onclick="handleStarterClick('이 작품을 같이 감상해 주세요')" class="text-left text-xs font-medium bg-stone-100 hover:bg-emerald-50 active:bg-emerald-100 dark:bg-stone-800 dark:hover:bg-emerald-950/60 text-stone-800 dark:text-stone-200 border border-stone-200/80 dark:border-stone-700 px-3.5 py-2.5 rounded-xl transition-colors flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gallery-accent dark:text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                <span>이 작품을 같이 감상해 주세요</span>
                            </button>
                            <button type="button" onclick="handleStarterClick('감상 방법을 알려 주세요')" class="text-left text-xs font-medium bg-stone-100 hover:bg-emerald-50 active:bg-emerald-100 dark:bg-stone-800 dark:hover:bg-emerald-950/60 text-stone-800 dark:text-stone-200 border border-stone-200/80 dark:border-stone-700 px-3.5 py-2.5 rounded-xl transition-colors flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-gallery-accent dark:text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                                <span>감상 방법을 알려 주세요</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', welcomeHTML);
        }

        function handleStarterClick(starterText) {
            if (isGenerating) return;
            if (starterText === '작품 사진을 올릴게요') {
                triggerImageUpload();
                showToast("감상할 작품 사진을 선택해 주세요!");
                return;
            }
            sendMessage(starterText, null);
        }

        function handleStepChipClick(stepPrompt) {
            if (isGenerating) return;
            sendMessage(stepPrompt, pendingImage);
            if (pendingImage) clearSelectedImage();
        }

        function triggerSummaryRequest() {
            if (isGenerating) return;
            sendMessage("정리해 줘", null);
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 112) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleFormSubmit(e);
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            if (isGenerating) return;

            const input = document.getElementById('userInput');
            const text = input.value.trim();

            if (!text && !pendingImage) return;

            const imageToSend = pendingImage;
            const messageText = text || "이 작품 사진을 함께 감상하고 싶어요.";

            input.value = '';
            input.style.height = 'auto';
            clearSelectedImage();

            sendMessage(messageText, imageToSend);
        }

        // 마크다운 기호 제거 후처리
        function cleanPlainText(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1')
                .replace(/^#+\s+/gm, '')
                .replace(/^[-*•]\s+/gm, '')
                .trim();
        }

        function escapeHTML(text) {
            return cleanPlainText(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\n/g, '<br>');
        }

        function appendUserBubble(text, imageObj) {
            const container = document.getElementById('chatContainer');
            const imageHTML = imageObj 
                ? `<div class="mb-2 overflow-hidden rounded-xl border border-white/20"><img src="${imageObj.dataUrl}" alt="올린 작품 사진" class="max-h-60 w-auto object-contain rounded-xl bg-black/10"></div>` 
                : '';

            const bubbleHTML = `
                <div class="flex justify-end animate-fade-in">
                    <div class="bg-gallery-accent dark:bg-emerald-800 text-white rounded-2xl rounded-tr-sm px-4 py-3 max-w-[85%] sm:max-w-[75%] text-sm leading-relaxed shadow-xs">
                        ${imageHTML}
                        <div>${escapeHTML(text)}</div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', bubbleHTML);
            scrollToBottom();
        }

        function appendAIBubble(text) {
            const container = document.getElementById('chatContainer');
            const messageId = 'ai-msg-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            const btnLabelId = 'copy-label-' + messageId;

            const bubbleHTML = `
                <div class="flex items-start gap-2.5 max-w-[92%] sm:max-w-[82%] animate-fade-in group">
                    <div class="w-8 h-8 rounded-full bg-gallery-accent dark:bg-emerald-800 text-white flex items-center justify-center shrink-0 mt-0.5 text-xs font-serif font-bold shadow-xs">
                        미술관
                    </div>
                    <div class="flex flex-col items-start gap-1.5 min-w-0">
                        <div id="${messageId}" class="bg-gallery-lightCard dark:bg-gallery-darkCard border border-stone-200/80 dark:border-stone-800 rounded-2xl rounded-tl-sm px-4 py-3.5 shadow-xs text-sm text-stone-800 dark:text-stone-200 leading-relaxed whitespace-pre-wrap">${escapeHTML(text)}</div>
                        <button type="button" onclick="copyBubbleText('${messageId}', '${btnLabelId}')" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-medium text-stone-500 hover:text-stone-800 hover:bg-stone-200/70 dark:text-stone-400 dark:hover:text-stone-200 dark:hover:bg-stone-800 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            <span id="${btnLabelId}">글 복사하기</span>
                        </button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', bubbleHTML);
            scrollToBottom();
        }

        function copyBubbleText(elementId, labelId) {
            const el = document.getElementById(elementId);
            const labelEl = document.getElementById(labelId);
            if (!el) return;
            const textToCopy = el.innerText;

            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = textToCopy;
            tempTextarea.style.position = 'fixed';
            tempTextarea.style.opacity = '0';
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            tempTextarea.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
                if (labelEl) {
                    labelEl.textContent = "복사됨!";
                    setTimeout(() => { labelEl.textContent = "글 복사하기"; }, 2000);
                }
                showToast("글이 복사되었어요! 패들렛이나 활동지에 붙여넣으세요.");
            } catch (err) {
                showToast("글자를 길게 눌러 복사해 주세요.");
            } finally {
                document.body.removeChild(tempTextarea);
            }
        }

        function showTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const typingHTML = `
                <div id="typingIndicator" class="flex items-start gap-2.5 max-w-[85%] animate-fade-in">
                    <div class="w-8 h-8 rounded-full bg-gallery-accent dark:bg-emerald-800 text-white flex items-center justify-center shrink-0 mt-0.5 text-xs font-serif font-bold">
                        미술관
                    </div>
                    <div class="bg-gallery-lightCard dark:bg-gallery-darkCard border border-stone-200/80 dark:border-stone-800 rounded-2xl rounded-tl-sm px-4 py-3.5 shadow-xs flex items-center gap-1.5 h-11">
                        <span class="w-2 h-2 rounded-full bg-stone-400 dark:bg-stone-500 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-stone-400 dark:bg-stone-500 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-stone-400 dark:bg-stone-500 typing-dot"></span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', typingHTML);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        function resetChat() {
            if (isGenerating) return;
            chatHistory = [];
            clearSelectedImage();
            renderWelcomeMessage();
            showToast("대화가 초기화되었어요. 새 작품 감상을 시작해 보세요!");
        }

        // ==========================================
        // 5. Gemini API 호출 로직 (말 끊김 방지 & 자동 이어받기)
        // ==========================================
        async function callGeminiEndpoint(payload, maxRetries = 4) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
            let useThinkingConfig = true;

            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const requestPayload = JSON.parse(JSON.stringify(payload));
                    if (!useThinkingConfig && requestPayload.generationConfig?.thinkingConfig) {
                        delete requestPayload.generationConfig.thinkingConfig;
                    }

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestPayload)
                    });

                    if (!response.ok) {
                        if (response.status === 400 && useThinkingConfig) {
                            useThinkingConfig = false;
                            continue;
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    const candidate = data?.candidates?.[0];
                    const parts = candidate?.content?.parts || [];
                    const replyText = parts.map(p => p.text || "").join("");
                    const finishReason = candidate?.finishReason;

                    if (!replyText) {
                        throw new Error("응답 텍스트가 비어 있습니다.");
                    }

                    return { text: replyText, finishReason };

                } catch (error) {
                    if (attempt === maxRetries) {
                        throw error;
                    }
                    const delay = Math.pow(2, attempt) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        async function fetchCompleteResponse(contentsHistory) {
            const basePayload = {
                contents: contentsHistory,
                systemInstruction: {
                    parts: [{ text: SYSTEM_INSTRUCTION }]
                },
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 2048,
                    thinkingConfig: { thinkingBudget: 0 }
                }
            };

            let { text: fullText, finishReason } = await callGeminiEndpoint(basePayload);

            // MAX_TOKENS로 끊긴 경우 최대 2회까지 자동 이어받기 수행
            let continuationCount = 0;
            while (finishReason === "MAX_TOKENS" && continuationCount < 2) {
                continuationCount++;
                const continuationContents = [
                    ...contentsHistory,
                    { role: "model", parts: [{ text: fullText }] },
                    { role: "user", parts: [{ text: "방금 하시던 말씀이 중간에 끊겼어요. 끊긴 부분부터 자연스럽게 이어서 질문까지 마무리해 주세요." }] }
                ];

                const nextPayload = {
                    ...basePayload,
                    contents: continuationContents
                };

                const nextChunk = await callGeminiEndpoint(nextPayload);
                fullText = fullText.trim() + " " + nextChunk.text.trim();
                finishReason = nextChunk.finishReason;
            }

            return cleanPlainText(fullText);
        }

        async function sendMessage(promptText, imageObj = null) {
            if (isGenerating) return;
            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;

            appendUserBubble(promptText, imageObj);

            const userParts = [{ text: promptText }];
            if (imageObj) {
                userParts.push({
                    inlineData: {
                        mimeType: imageObj.mimeType,
                        data: imageObj.base64
                    }
                });
            }

            chatHistory.push({
                role: "user",
                parts: userParts
            });

            showTypingIndicator();

            try {
                const aiResponse = await fetchCompleteResponse(chatHistory);
                removeTypingIndicator();
                appendAIBubble(aiResponse);

                chatHistory.push({
                    role: "model",
                    parts: [{ text: aiResponse }]
                });

            } catch (error) {
                removeTypingIndicator();
                appendAIBubble("잠시 연결이 고르지 못했어요. 인터넷 상태를 확인하고 다시 한 번 말씀해 주시겠어요?");
                chatHistory.pop();
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }
    </script>
