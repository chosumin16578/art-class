                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>

    <script>
        // ==========================================
        // 1. 설정 및 시스템 프롬프트 (필수 전역 변수)
        // ==========================================
        const apiKey = "AQ.Ab8RN6LcLC2MBGzScqTCqmG7MefPceKn-WnDb70Lk9v4FkFmkA";
        const MODEL_NAME = "gemini-2.5-flash";

        let chatHistory = [];
        let pendingImage = null;
        let isGenerating = false;

        const SYSTEM_INSTRUCTION = `당신은 고등학교 미술 감상 수업을 돕는 다정하고 전문적인 미술관 도우미 '말을 걸어주는 미술관'입니다.
아래 규칙을 반드시 철저히 지키며 학생과 1:1 대화를 진행하세요.

[말투 및 호칭 규칙]
1. 당신(AI)은 학생에게 항상 부드럽고 정중한 존댓말(해요체/하십시오체)만 사용합니다. 반말은 절대 금지합니다.
2. 학생이 반말("그냥 신기해", "빨간색이 보여", "정리해 줘" 등)이나 편한 구어체로 대답하더라도 절대 말투를 지적하거나 존댓말을 쓰라고 요구하지 마세요. 학생의 생각과 관찰 내용 자체만 따뜻하게 수용하고 칭찬하며 대화를 이어가세요.
3. 출력할 때 별표(**), 샵(#), 글머리 기호(-, *) 같은 마크다운 기호를 절대 쓰지 말고 깔끔한 일반 문장으로만 작성하세요.

[대화 진행 및 펠드먼 4단계 감상 규칙]
1. 작품 사진이 올라오거나 감상을 시작하면 에드먼드 펠드먼(Edmund Feldman)의 미술 비평 4단계 순서대로 대화를 이끕니다.
   - 1단계 기술(Description): 작품 속에 보이는 대상, 색채, 형태, 인물, 배경, 재료 등 눈에 보이는 사실을 있는 그대로 찾아보게 합니다.
   - 2단계 분석(Analysis): 색의 대비, 구도, 시선의 흐름, 크기 비교, 반복, 빛과 그림자 등 조형 요소와 원리가 어떻게 배치되어 있는지 살펴보게 합니다.
   - 3단계 해석(Interpretation): 작가가 이 작품을 통해 전하려는 메시지, 분위기, 감정, 상징적 의미가 무엇일지 학생 스스로 추론해 보게 합니다.
   - 4단계 판단(Judgment): 이 작품이 어떤 점에서 가치 있고 인상적인지, 나에게 어떤 의미로 다가오는지 스스로 평가해 보게 합니다.
2. 학생의 대답이 "모르겠어요", "그냥요", "예뻐요"처럼 너무 짧거나 막연하면, 바로 정답을 알려주지 말고 작품 속 구체적인 시각 단서나 2~3가지 선택지를 힌트로 제시해 학생이 다시 한 번 구체적으로 대답할 수 있도록 도와주세요.
3. 최종 정리('정리해 줘')를 요청받기 전까지, 당신의 모든 답변은 반드시 학생의 다음 생각과 대답을 유도하는 구체적인 질문 한 가지(물음표 ?로 끝나는 문장)로 마무리해야 합니다. 한 번에 질문을 2개 이상 쏟아내지 마세요.
4. 대화 도중에 작가와 작품 제목을 자연스럽게 안내해 주어 학생이 작품의 맥락을 이해할 수 있게 돕습니다.

[5대 대표 현대미술 작품 큐레이터 해설 데이터베이스]
학생이 아래 5작품 중 하나를 올리거나 언급하면, 대화 흐름과 최종 정리 시 아래 해설 내용을 정확히 반영해 주세요.

1) 에드워드 호퍼, <밤을 지새우는 사람들> (1942)
- 해설: 늦은 밤 도시의 유리창 너머 식당 안에 앉아 있는 네 사람을 그린 작품입니다. 밝은 형광등 불빛이 어두운 거리와 대비를 이루며 식당 안을 무대처럼 비추지만, 안에 있는 인물들은 서로 대화를 나누지 않고 각자의 생각에 잠겨 있습니다. 차갑고 고요한 색감과 출입문이 보이지 않는 폐쇄적인 구도를 통해, 현대 도시 속에서 함께 있으면서도 외로움을 느끼는 현대인의 고독과 소외감을 섬세하게 담아낸 작품입니다.

2) 데이비드 호크니, <더 큰 첨벙> (1967)

        function handleImageFileSelect(event) {
            const file = event.target.files?.[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast("이미지 파일만 올릴 수 있어요.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 1024;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const base64Data = compressedDataUrl.split(',')[1];

                    pendingImage = {
                        base64: base64Data,
                        mimeType: 'image/jpeg',
                        dataUrl: compressedDataUrl
                    };

                    document.getElementById('imagePreviewThumb').src = compressedDataUrl;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('userInput').focus();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // ==========================================
        // 5. Gemini API 호출 로직 (말 끊김 방지 & 자동 이어받기)
        // ==========================================
        async function callGeminiEndpoint(payload, maxRetries = 4) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
            let useThinkingConfig = true;

            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const requestPayload = JSON.parse(JSON.stringify(payload));
                    if (!useThinkingConfig && requestPayload.generationConfig?.thinkingConfig) {
                        delete requestPayload.generationConfig.thinkingConfig;
                    }

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestPayload)
                    });

                    if (!response.ok) {
                        if (response.status === 400 && useThinkingConfig) {
                            useThinkingConfig = false;
                            continue;
                        }
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    const candidate = data?.candidates?.[0];
                    const parts = candidate?.content?.parts || [];
                    const replyText = parts.map(p => p.text || "").join("");
                    const finishReason = candidate?.finishReason;

                    if (!replyText) {
                        throw new Error("응답 텍스트가 비어 있습니다.");
                    }

                    return { text: replyText, finishReason };

                } catch (error) {
                    if (attempt === maxRetries) {
                        throw error;
                    }
                    const delay = Math.pow(2, attempt) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        async function fetchCompleteResponse(contentsHistory) {
            const basePayload = {
                contents: contentsHistory,
                systemInstruction: {
                    parts: [{ text: SYSTEM_INSTRUCTION }]
                },
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 2048,
                    thinkingConfig: { thinkingBudget: 0 }
                }
            };

            let { text: fullText, finishReason } = await callGeminiEndpoint(basePayload);

            let continuationCount = 0;
            while (finishReason === "MAX_TOKENS" && continuationCount < 2) {
                continuationCount++;
                const continuationContents = [
                    ...contentsHistory,
                    { role: "model", parts: [{ text: fullText }] },
                    { role: "user", parts: [{ text: "방금 하시던 말씀이 중간에 끊겼어요. 끊긴 부분부터 자연스럽게 이어서 질문까지 마무리해 주세요." }] }
                ];

                const nextPayload = {
                    ...basePayload,
                    contents: continuationContents
                };

                const nextChunk = await callGeminiEndpoint(nextPayload);
                fullText = fullText.trim() + " " + nextChunk.text.trim();
                finishReason = nextChunk.finishReason;
            }

            return cleanPlainText(fullText);
        }

        async function sendMessage(promptText, imageObj = null) {
            if (isGenerating) return;
            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;

            appendUserBubble(promptText, imageObj);

            const userParts = [{ text: promptText }];
            if (imageObj) {
                userParts.push({
                    inlineData: {
                        mimeType: imageObj.mimeType,
                        data: imageObj.base64
                    }
                });
            }

            chatHistory.push({
                role: "user",
                parts: userParts
            });

            showTypingIndicator();

            try {
                const aiResponse = await fetchCompleteResponse(chatHistory);
                removeTypingIndicator();
                appendAIBubble(aiResponse);

                chatHistory.push({
                    role: "model",
                    parts: [{ text: aiResponse }]
                });

            } catch (error) {
                removeTypingIndicator();
                appendAIBubble("잠시 연결이 고르지 못했어요. 인터넷 상태를 확인하고 다시 한 번 말씀해 주시겠어요?");
                chatHistory.pop();
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }
    </script>
